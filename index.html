    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="bmi.css">
    <style>
        *{
            align-items: center;
            text-align: center;
        }
        .container{
            margin-top:  30px;
            padding: 30px;
            text-align: center;
            width: 30%;
            height: 400px;
            border-radius: 10px;
            border-color: saddlebrown;
            border: 10px;
            background-color:wheat;
            box-shadow: 2px 2px 10px 5px brown;
        }
        @media screen and (max-width:468px) {

.container{
    width: 90%;
    height: auto;
}
h2{
    font-size: 15px;
}
h3{
    font-size: 18px;
}
h4{
    font-size: 15px;
} 
h5{
    font-size: 15px;
}

    font-size: 15px;
    
  }

</head>
<body><br>
    <h4 style="font-weight: bold; color: green;">Entri - Fullstack Webdevelopment Course 2024-25</h4>
    <h5 style="font-weight: bold; color: brown;">BMI Calculator - Javascript Assignment</h5>
    <div class="container">
       <h2 style="color: blue; font-weight: bold;">BMI Calculator</h2>
       <form action="">
         <div class="form-group">
                   <label>Height in Cm</label>
                    <input type ="text" id="height" class="form-control" placeholder="Enter height"><br>
                    <label>Weight in Kg</label>
                   <input type ="text" id="weight" class="form-control" placeholder="Enter weight"> <br>
                   <button class="bt btn-primary" >Calculate</button>
                   <button  class="bt btn-danger" onclick="reload()">Clear</button>
                  </div> <br>
             </form>
             <div class="resultbox">
                <h3 style="color: green; font-weight: bold;">Your BMI is : <span id ="result"></span></h3>
                <h4 style="color: red; font-weight: bold;"><span id ="result2"></span></h4><br>
            </div>
        </div>
         </div> 
           
    <script src="bmi.js"></script><br>
    <p style="color: red; background-color: yellow;">(Underweight: >18.5, Normal weight: 18.5 to 24.9, Overweight: 25 to 29.9, Obesity: 30 to 39, Severe Obesity: 40 & above)</p>
